<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <title>Foo Hou Lin</title>
      <style>
         .form-container {
            display: flex;
            align-items: center;
            min-height: 100vh; 
            flex-direction: column;
         }

         body{
            margin: 0;
            font-family: "Open Sans", "Helvetica Neue", sans-serif !important;
           
         }

         hr .footer-line{
            border: 1px solid #D3D2D7;
            width: 100%;
         }

         .footer-text{
            color: #4D4D4E;
            margin-left: 8px ;
            opacity: 0.75 ;
            font-size: 11px; 
         }

         h1{
            font-weight: 400;
            font-size: 24pt;
            line-height: 1.25;
            letter-spacing: 0;
         }

         .containerWrap{
            background-color: #fff;
            border: 1px solid rgb(218,220,224);
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 24px;
            position: relative;
         }

          .containerWrap-borderless{
            background-color: #fff;
            border: 1px solid rgb(255,255,255);
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 24px;
            position: relative;
         }

         .footer-container{
            width: 100%;
            position: flex;
            bottom: 0;
            background-color: #fff;
         }

         .header-text{
            font-size: 11pt;
         }

         .deletionFormTextInput{
            border: none;
            border-bottom: 1px solid #d3d3d3;
            outline: none; 
            width: 50%;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: .3px;
            line-height: 16px;
            margin-top: 12px;
         }

         .caption{
            font-size: 12px;
            font-weight: 400;
            letter-spacing: .3px;
            line-height: 16px;
            color: #606262;
         }

         input[type="submit"] {
            background-color: #4CAF50; 
            color: white; 
            padding: 10px 20px;
            border: none;
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
         }

          input[type="submit"] :disabled {
            opacity: 0.6;
             background-color: #ddd;
         }

          .button-container {
            display: flex;
            align-items: center;
           }

         /* CSS for the loading icon */
        .loader {
            border: 6px solid #f3f3f3; /* Light grey border */
            border-top: 6px solid #3498db; /* Blue border */
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite; /* Rotate the icon */
            visibility: hidden;
            margin-left: 8px ;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .disabled-div {
            pointer-events: auto;
        }

        .headerContainter{
            width: 100%;
        }

        .responsive{
            width: 100%;
            height: 70px;
        }

        @media (max-width: 600px) { 
            .containerWrap  {
               max-width: 80%;
               width: 80%;
            }
            .containerWrap-borderless{
               max-width: 80%;
               width: 80%;
            }
            .responsive{
               object-fit: none;
               object-position: 5% 100%;
           }

         }

         @media (min-width: 600px) { 
             .containerWrap  {
                  max-width: 50%;
                  width: 50%;
             }
             .containerWrap-borderless{
               max-width: 50%;
               width: 50%;
            }
         }
      </style>
   </head>
   <body>
      
      <div class="form-container">
         <div class="containerWrap-borderless" id="headerBox">
            <h1> HELLO WORLD </h1>
            <p class="header-text"> BYE BYE</p>
         </div>
      </div>

     
   </body>
   <script>

      
</script>
</html>
